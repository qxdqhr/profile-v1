# 本地开发：与生产网关相同的 /wp/holt/ 前缀反代（保留完整 URI）
server {
    listen 80;
    server_name _;

    location /wp/holt/ {
        set $wp_upstream wordpress_holt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$wp_upstream;
    }

    location = /wp/holt {
        return 301 /wp/holt/;
    }

    location = /wp {
        return 301 /wp/holt/;
    }

    location = /wp/ {
        return 301 /wp/holt/;
    }

    location / {
        return 404;
    }
}
