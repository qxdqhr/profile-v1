# 本地开发：与生产网关相同的 /wp/personal/ 前缀反代
# 使用变量 + Docker DNS，避免启动时 upstream 主机尚未注册导致 nginx emerg
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 52m;

    location /wp/personal/ {
        set $wp_upstream wordpress_personal;
        proxy_pass http://$wp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        # 去掉 /wp/personal 前缀
        rewrite ^/wp/personal/?(.*)$ /$1 break;
    }

    location = /wp/personal {
        return 301 /wp/personal/;
    }

    location = /wp {
        return 301 /wp/personal/;
    }

    location = /wp/ {
        return 301 /wp/personal/;
    }

    location / {
        return 404;
    }
}
