# 本地独立起 WordPress（不依赖 Next 网关；nginx 模拟 /wp/holt/ 前缀）
# 用法：
#   cd deploy/wordpress
#   cp .env.example .env
#   docker compose -f docker-compose.dev.yml --env-file .env up -d
#   浏览器：http://127.0.0.1:18080/wp/holt/

services:
  wp_mariadb:
    image: docker.m.daocloud.io/library/mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-change-me-root}
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-wp_holt}
      MARIADB_USER: ${WORDPRESS_DB_USER:-wp}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-change-me-wp}
    ports:
      - '${MARIADB_DEV_PORT:-3307}:3306'
    volumes:
      - wp_mariadb_data_dev:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - wp_dev

  wordpress_holt:
    image: docker.m.daocloud.io/library/wordpress:6-apache
    restart: unless-stopped
    depends_on:
      wp_mariadb:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wp_mariadb:3306
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-change-me-wp}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wp_holt}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_HOLT_PUBLIC_URL:-http://127.0.0.1:18080/wp/holt}');
        define('WP_SITEURL', '${WP_HOLT_PUBLIC_URL:-http://127.0.0.1:18080/wp/holt}');
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - wp_holt_uploads_dev:/var/www/html/wp-content/uploads
      - ./themes/holt-portfolio:/var/www/html/wp-content/themes/holt-portfolio:ro
    networks:
      - wp_dev

  nginx:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - wordpress_holt
    ports:
      - '${WP_DEV_HTTP_PORT:-18080}:80'
    volumes:
      - ./nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - wp_dev

networks:
  wp_dev:
    driver: bridge

volumes:
  wp_mariadb_data_dev:
  wp_holt_uploads_dev:
