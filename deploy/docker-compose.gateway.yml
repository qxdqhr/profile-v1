# 生产网关栈：nginx + web + calendar + teach-hub + showmasterpiece + money-research + node-notes
# + 旁路 WordPress（/wp/<slug>/，非 Next；见 deploy/wordpress/README.md）
# + 旁路 Godot/静态游戏（/games/<slug>/，见 deploy/games/README.md）
# 用法见 deploy/MIGRATION-RUNBOOK.md

x-next-health: &next-health
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 45s

services:
  web:
    image: ${REGISTRY}/qhr-profile-web:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      APP_CONFIG_ENV: production
      APP_CONFIG_PATH: /app/config/app.config.production.yaml
      # 容器内访问宿主机 Postgres 时，在 .env 覆盖（勿用公网域名，易 hairpin 失败）：
      # DATABASE_URL=postgresql://postgres:PASSWORD@host.docker.internal:5432/exam_system
      DATABASE_URL: ${DATABASE_URL:-}
      NEXT_PUBLIC_CALENDAR_URL: /calendar
      NEXT_PUBLIC_TEACH_HUB_URL: /teach-hub
      NEXT_PUBLIC_SHOWMASTERPIECE_URL: /showmasterpiece
      NEXT_PUBLIC_MONEY_RESEARCH_URL: /money-research
      NEXT_PUBLIC_NODE_NOTES_URL: /node-notes
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./app.config.yaml:/app/config/app.config.production.yaml:ro
    expose:
      - '3000'
    healthcheck:
      <<: *next-health
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
    networks:
      - profile

  calendar:
    image: ${REGISTRY}/qhr-profile-calendar:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      APP_CONFIG_ENV: production
      APP_CONFIG_PATH: /app/config/app.config.production.yaml
      DATABASE_URL: ${DATABASE_URL:-}
      NEXT_PUBLIC_BASE_PATH: /calendar
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./app.config.yaml:/app/config/app.config.production.yaml:ro
    expose:
      - '3001'
    healthcheck:
      <<: *next-health
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/calendar').then((r)=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
    networks:
      - profile

  teach_hub:
    image: ${REGISTRY}/qhr-profile-teach-hub:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      APP_CONFIG_ENV: production
      APP_CONFIG_PATH: /app/config/app.config.production.yaml
      DATABASE_URL: ${DATABASE_URL:-}
      NEXT_PUBLIC_BASE_PATH: /teach-hub
      NEXT_PUBLIC_TEACH_HUB_BASE_URL: ''
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./app.config.yaml:/app/config/app.config.production.yaml:ro
    expose:
      - '3002'
    healthcheck:
      <<: *next-health
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/teach-hub').then((r)=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
    networks:
      - profile

  showmasterpiece:
    image: ${REGISTRY}/qhr-profile-showmasterpiece:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      APP_CONFIG_ENV: production
      APP_CONFIG_PATH: /app/config/app.config.production.yaml
      DATABASE_URL: ${DATABASE_URL:-}
      NEXT_PUBLIC_BASE_PATH: /showmasterpiece
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./app.config.yaml:/app/config/app.config.production.yaml:ro
    expose:
      - '3003'
    healthcheck:
      <<: *next-health
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/showmasterpiece').then((r)=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
    networks:
      - profile

  money_research:
    image: ${REGISTRY}/qhr-profile-money-research:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_BASE_PATH: /money-research
    expose:
      - '3004'
    healthcheck:
      <<: *next-health
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3004/money-research').then((r)=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
    networks:
      - profile

  node_notes:
    image: ${REGISTRY}/qhr-profile-node-notes:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      APP_CONFIG_ENV: production
      APP_CONFIG_PATH: /app/config/app.config.production.yaml
      DATABASE_URL: ${DATABASE_URL:-}
      NEXT_PUBLIC_BASE_PATH: /node-notes
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./app.config.yaml:/app/config/app.config.production.yaml:ro
    expose:
      - '3005'
    healthcheck:
      <<: *next-health
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3005/node-notes').then((r)=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
    networks:
      - profile

  # --- WordPress 旁路（独立 MariaDB；与宿主机 Postgres 无关）---
  wp_mariadb:
    image: docker.m.daocloud.io/library/mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-wp_holt}
      MARIADB_USER: ${WORDPRESS_DB_USER:?set WORDPRESS_DB_USER}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?set WORDPRESS_DB_PASSWORD}
    volumes:
      - wp_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - profile

  wordpress_holt:
    image: docker.m.daocloud.io/library/wordpress:6-apache
    restart: unless-stopped
    depends_on:
      wp_mariadb:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: wp_mariadb:3306
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:?set WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?set WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wp_holt}
      WP_HOLT_PUBLIC_URL: ${WP_HOLT_PUBLIC_URL:-https://qhr062.top/wp/holt}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_HOLT_PUBLIC_URL:-https://qhr062.top/wp/holt}');
        define('WP_SITEURL', '${WP_HOLT_PUBLIC_URL:-https://qhr062.top/wp/holt}');
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
          $$_SERVER['HTTPS'] = 'on';
        }
        // nginx 对核心路径去掉了 /wp/holt；补回 REQUEST_URI，避免跳到 https://host/wp-admin
        $$__holt_path = rtrim((string) (parse_url(WP_HOME, PHP_URL_PATH) ?: ''), '/');
        if ($$__holt_path !== '' && !empty($$_SERVER['REQUEST_URI']) && strpos($$_SERVER['REQUEST_URI'], $$__holt_path) !== 0) {
          if (preg_match('#^/(wp-admin|wp-includes|wp-content|xmlrpc[.]php|wp-[^/]+[.]php)(/|[?]|$)#', $$_SERVER['REQUEST_URI'])) {
            $$_SERVER['REQUEST_URI'] = $$__holt_path . $$_SERVER['REQUEST_URI'];
          }
        }
    volumes:
      - wp_holt_uploads:/var/www/html/wp-content/uploads
      # 主题源码：仓根 app_wordpress/holt（git submodule）
      - ./app_wordpress/holt:/var/www/html/wp-content/themes/holt-portfolio:ro
    networks:
      - profile

  nginx:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - calendar
      - teach_hub
      - showmasterpiece
      - money_research
      - node_notes
      # wordpress_holt 不作为硬依赖：MariaDB 不健康时不应拖垮整站 /games
      # Godot 静态包由本容器 alias /var/www/games/<slug>/www，不再 depends_on 独立游戏 nginx
    ports:
      - '${GATEWAY_PORT:-3000}:80'
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./nginx/profile-platform.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy-params.conf:/etc/nginx/proxy-params.conf:ro
      - ./games:/var/www/games:ro
    networks:
      - profile

networks:
  profile:
    driver: bridge

volumes:
  wp_mariadb_data:
  wp_holt_uploads:
