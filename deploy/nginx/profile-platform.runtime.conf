# GENERATED by deploy/gateway/render-runtime-nginx.py — do not edit by hand.
# enabled modules: calendar, filetransfer, idea_list, node_notes, showmasterpiece, teach_hub, web
# profile-platform 同域路径反代（方案 B）
# 挂载至 nginx /etc/nginx/conf.d/default.conf（部署时由 render-runtime-nginx.py
# 按 deploy/runtime-modules.json 裁剪为 profile-platform.runtime.conf 再挂载）
# upstream 主机名与 deploy/docker-compose.gateway.yml 中 service 名一致
# 可选子应用用 # @module <key> … # @endmodule <key> 包裹；key 与 runtime-modules.json 一致。

upstream profile_web {
    server web:3000;
    keepalive 32;
}

upstream profile_calendar {
    server calendar:3001;
    keepalive 16;
}

upstream profile_teach_hub {
    server teach_hub:3002;
    keepalive 16;
}

upstream profile_showmasterpiece {
    server showmasterpiece:3003;
    keepalive 16;
}


upstream profile_node_notes {
    server node_notes:3005;
    keepalive 16;
}

upstream profile_idea_list {
    server idea_list:3006;
    keepalive 16;
}

upstream profile_filetransfer {
    server filetransfer:3007;
    keepalive 16;
}





# WordPress 旁路（纯 PHP；路径 /wp/<slug>/）
# 不用静态 upstream：避免 wordpress_* 尚未注册 DNS 时整站 nginx emerg 起不来
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 外层 HTTPS 终止时保留真实协议，供 better-auth 正确设置 Secure Cookie
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 52m;

    # Docker 内置 DNS（WordPress 旁路用变量 proxy_pass 时需要）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- legacy 实验田路径（显式 https，避免外层未传 X-Forwarded-Proto 时 301 落到 http）---
    location ~ ^/testField/calendar/?(.*)$ {
        return 301 https://$http_host/calendar/$1;
    }
    location ~ ^/testField/teachHub/?(.*)$ {
        return 301 https://$http_host/teach-hub/$1;
    }
    location ~ ^/testField/ShowMasterPieces/?(.*)$ {
        return 301 https://$http_host/showmasterpiece/$1;
    }
    location ~ ^/testField/nodeNotes/?(.*)$ {
        return 301 https://$http_host/node-notes/$1;
    }
    location ~ ^/testField/ideaList/?(.*)$ {
        return 301 https://$http_host/idea-list/$1;
    }
    location ~ ^/testField/filetransfer/?(.*)$ {
        return 301 https://$http_host/filetransfer/$1;
    }

    # --- calendar ---
    # Next basePath=/calendar：容器内真实 API 为 /calendar/api/calendar/*
    location /api/calendar/ {
        proxy_pass http://profile_calendar/calendar/api/calendar/;
        include /etc/nginx/proxy-params.conf;
    }
    location = /api/calendar {
        return 301 /api/calendar/;
    }
    # 前缀匹配：勿对 /calendar 强制加尾斜杠（Next basePath 默认 trailingSlash=false 会 308 去掉斜杠，与 301 形成死循环）
    location /calendar {
        proxy_pass http://profile_calendar;
        include /etc/nginx/proxy-params.conf;
    }

    # --- teach-hub ---
    # Next basePath=/teach-hub：容器内真实 API 为 /teach-hub/api/teach-hub/*
    location /api/teach-hub/ {
        proxy_pass http://profile_teach_hub/teach-hub/api/teach-hub/;
        include /etc/nginx/proxy-params.conf;
    }
    location = /api/teach-hub {
        return 301 /api/teach-hub/;
    }
    location /teach-hub {
        proxy_pass http://profile_teach_hub;
        include /etc/nginx/proxy-params.conf;
    }

    # --- showmasterpiece ---
    location /api/showmasterpiece/ {
        proxy_pass http://profile_showmasterpiece/showmasterpiece/api/showmasterpiece/;
        include /etc/nginx/proxy-params.conf;
    }
    location = /api/showmasterpiece {
        return 301 /api/showmasterpiece/;
    }
    location /showmasterpiece {
        proxy_pass http://profile_showmasterpiece;
        include /etc/nginx/proxy-params.conf;
    }


    # --- node-notes ---
    # Next basePath=/node-notes：容器内真实 API 为 /node-notes/api/node-notes/*
    location /api/node-notes/ {
        proxy_pass http://profile_node_notes/node-notes/api/node-notes/;
        include /etc/nginx/proxy-params.conf;
    }
    location = /api/node-notes {
        return 301 /api/node-notes/;
    }
    location /node-notes {
        proxy_pass http://profile_node_notes;
        include /etc/nginx/proxy-params.conf;
    }

    # --- idea-list ---
    location /api/ideaLists/ {
        proxy_pass http://profile_idea_list/idea-list/api/ideaLists/;
        include /etc/nginx/proxy-params.conf;
    }
    location = /api/ideaLists {
        return 301 /api/ideaLists/;
    }
    location /idea-list {
        proxy_pass http://profile_idea_list;
        include /etc/nginx/proxy-params.conf;
    }

    # --- filetransfer ---
    location /api/filetransfer/ {
        proxy_pass http://profile_filetransfer/filetransfer/api/filetransfer/;
        include /etc/nginx/proxy-params.conf;
    }
    location = /api/filetransfer {
        return 301 /api/filetransfer/;
    }
    location /filetransfer {
        proxy_pass http://profile_filetransfer;
        include /etc/nginx/proxy-params.conf;
    }





    # --- Godot / 静态游戏：平台 nginx 直接读 deploy/games/<slug>/www ---
    # 公网 /games/<slug>/index.wasm → 磁盘 /var/www/games/<slug>/www/index.wasm
    # `/games` 与 `/games/` 仍走主站 Next 游戏入口（location /）。
    # 加游戏不必再改本文件或 compose 服务。见 deploy/games/ADD-GAME.md
    location ~ ^/games/([a-z0-9-]+)$ {
        return 301 /games/$1/;
    }
    location ~ ^/games/([a-z0-9-]+)/([A-Za-z0-9._/-]*)$ {
        rewrite ^/games/([a-z0-9-]+)/([A-Za-z0-9._/-]*)$ /__games/$1/www/$2 last;
    }

    # 共享引擎：跨游戏同一 URL，长缓存（须写在通用 /__games/ 之前仅作可读性；nginx 按最长前缀选）
    location ^~ /__games/godot-engine/ {
        internal;
        alias /var/www/games/godot-engine/;
        gzip_static on;
        gzip off;
        gzip_vary on;
        sendfile on;
        tcp_nopush on;
        etag on;
        add_header Cache-Control "public, max-age=31536000, immutable";
        error_page 403 =404;
    }

    location ^~ /__games/ {
        internal;
        alias /var/www/games/;
        index index.html;
        # gzip_static 直出预压的 index.wasm.gz / index.pck.gz。
        # 禁止现场 gzip：38MB wasm 压一次就能打满 1–2 核，外层 TLS 代理跟着 502。
        gzip_static on;
        gzip off;
        gzip_vary on;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        # 不要在此写 types { wasm }：location 内会覆盖 mime.types，index.html 会变成 octet-stream。
        # nginx 1.21+ 的 mime.types 已含 application/wasm。
        etag on;
        add_header Cache-Control "public, max-age=3600";
        error_page 403 =404;
    }


    # --- 主站 auth（子应用 cookie 与 session 共用）---
    location /api/auth/ {
        proxy_pass http://profile_web;
        include /etc/nginx/proxy-params.conf;
    }

    # --- AI：浏览器 /api/ai/* 唯一落点为主站 web（子应用不挂副本）---
    location /api/ai/ {
        proxy_pass http://profile_web;
        include /etc/nginx/proxy-params.conf;
    }

    # --- web 默认 ---
    location / {
        proxy_pass http://profile_web;
        include /etc/nginx/proxy-params.conf;
    }
}
