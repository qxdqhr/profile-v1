name: Remote Fix Nginx and Env

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SSH fix on server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_SERVER_USERNAME }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
        run: |
          set -euo pipefail
          echo "${{ secrets.DEPLOY_SERVER_SSH_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          SSH_OPTS="-o StrictHostKeyChecking=no -i /tmp/ssh_key"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"

          ssh $SSH_OPTS "$REMOTE" "mkdir -p /root/profile-v1/ops /root/profile-v1/gateway /root/profile-v1/nginx"
          scp $SSH_OPTS deploy/ops/remote-fix-nginx-env.sh "$REMOTE:/root/profile-v1/ops/remote-fix-nginx-env.sh"
          scp $SSH_OPTS deploy/gateway/ensure-database-url.sh deploy/gateway/derive-database-url.sh deploy/gateway/_lib.sh \
            deploy/gateway/check-gateway-health.sh \
            "$REMOTE:/root/profile-v1/gateway/"
          scp $SSH_OPTS deploy/nginx/profile-platform.conf "$REMOTE:/root/profile-v1/nginx/profile-platform.conf"
          ssh $SSH_OPTS "$REMOTE" "chmod +x /root/profile-v1/ops/*.sh /root/profile-v1/gateway/*.sh && /root/profile-v1/ops/remote-fix-nginx-env.sh"
          rm -f /tmp/ssh_key
