name: Gateway Diagnose and Fix

# 合并原 gateway-fix + gateway-fix-only：同一远程入口 gateway/fix-gateway-remote.sh
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run remote gateway fix
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_SERVER_USERNAME }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
        run: |
          set -euo pipefail
          echo "${{ secrets.DEPLOY_SERVER_SSH_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          SSH_OPTS="-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -i /tmp/ssh_key"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"

          ssh $SSH_OPTS "$REMOTE" "mkdir -p /root/profile-v1/gateway"
          scp $SSH_OPTS \
            deploy/gateway/fix-gateway-remote.sh \
            deploy/gateway/check-gateway-health.sh \
            deploy/gateway/derive-database-url.sh \
            deploy/gateway/deploy-profile-v1.sh \
            deploy/gateway/ensure-nginx-image.sh \
            deploy/gateway/ensure-database-url.sh \
            deploy/gateway/wait-gateway-ready.sh \
            deploy/gateway/audit-outer-nginx.sh \
            deploy/gateway/smoke-test-gateway.sh \
            deploy/gateway/ensure-calendar-schema.sh \
            deploy/gateway/ensure-node-notes-schema.sh \
            deploy/gateway/_lib.sh \
            "$REMOTE:/root/profile-v1/gateway/"
          ssh $SSH_OPTS "$REMOTE" "chmod +x /root/profile-v1/gateway/*.sh"
          ssh $SSH_OPTS "$REMOTE" "/root/profile-v1/gateway/fix-gateway-remote.sh"
          rm -f /tmp/ssh_key
