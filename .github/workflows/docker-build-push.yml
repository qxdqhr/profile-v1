name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: crpi-pnnot5dqi45utyya.cn-beijing.personal.cr.aliyuncs.com/qhrqht

jobs:
  gate:
    name: Architecture and UI gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ripgrep and tsx
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep && npm install -g tsx@4.19.4

      - name: Run profile gates
        run: pnpm gate

  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      calendar: ${{ steps.filter.outputs.calendar }}
      teach-hub: ${{ steps.filter.outputs.teach-hub }}
      showmasterpiece: ${{ steps.filter.outputs.showmasterpiece }}
      money-research: ${{ steps.filter.outputs.money-research }}
      node-notes: ${{ steps.filter.outputs.node-notes }}
      idea-list: ${{ steps.filter.outputs.idea-list }}
      filetransfer: ${{ steps.filter.outputs.filetransfer }}
      ticket-monitor: ${{ steps.filter.outputs.ticket-monitor }}
      fitness-plan: ${{ steps.filter.outputs.fitness-plan }}
      comfy-prompt: ${{ steps.filter.outputs.comfy-prompt }}
      utilities: ${{ steps.filter.outputs.utilities }}
      calendar-mobile: ${{ steps.filter.outputs.calendar-mobile }}
      teach-hub-mobile: ${{ steps.filter.outputs.teach-hub-mobile }}
      deploy: ${{ steps.filter.outputs.deploy }}
      games: ${{ steps.filter.outputs.games }}
      wordpress: ${{ steps.filter.outputs.wordpress }}
      docker_satellites: ${{ steps.matrix.outputs.satellites }}
      any_satellites: ${{ steps.matrix.outputs.any_satellites }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect path changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'app_web/web/**'
              - 'host/auth/**'
              - 'host/config/**'
              - 'host/db/**'
              - 'host/ui/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'packages/sa2kit/**'
              - 'packages/sa2kit-ui/**'
              - '.gitmodules'
            calendar:
              - 'app_web/calendar/**'
              - 'host/auth/**'
              - 'host/config/**'
              - 'host/db/**'
              - 'host/ui/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'packages/sa2kit/**'
              - 'packages/sa2kit-ui/**'
              - '.gitmodules'
            teach-hub:
              - 'app_web/teach-hub/**'
              - 'host/auth/**'
              - 'host/config/**'
              - 'host/db/**'
              - 'host/ui/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'packages/sa2kit/**'
              - 'packages/sa2kit-ui/**'
              - '.gitmodules'
            showmasterpiece:
              - 'app_web/showmasterpiece/**'
              - 'host/auth/**'
              - 'host/config/**'
              - 'host/db/**'
              - 'host/ui/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'packages/sa2kit/**'
              - 'packages/sa2kit-ui/**'
              - '.gitmodules'
            money-research:
              - 'app_web/money-research/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            node-notes:
              - 'app_web/node-notes/**'
              - 'host/auth/**'
              - 'host/config/**'
              - 'host/db/**'
              - 'host/ui/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'packages/sa2kit/**'
              - 'packages/sa2kit-ui/**'
              - '.gitmodules'
            idea-list:
              - 'app_web/idea-list/**'
              - 'host/auth/**'
              - 'host/config/**'
              - 'host/db/**'
              - 'host/ui/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'packages/sa2kit/**'
              - 'packages/sa2kit-ui/**'
              - '.gitmodules'
            filetransfer:
              - 'app_web/filetransfer/**'
              - 'host/auth/**'
              - 'host/config/**'
              - 'host/db/**'
              - 'host/ui/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'packages/sa2kit/**'
              - 'packages/sa2kit-ui/**'
              - '.gitmodules'
            ticket-monitor:
              - 'app_web/ticket-monitor/**'
              - 'host/auth/**'
              - 'host/config/**'
              - 'host/db/**'
              - 'host/ui/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'packages/sa2kit/**'
              - 'packages/sa2kit-ui/**'
              - '.gitmodules'
            fitness-plan:
              - 'app_web/fitness-plan/**'
              - 'host/auth/**'
              - 'host/config/**'
              - 'host/db/**'
              - 'host/ui/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'packages/sa2kit/**'
              - 'packages/sa2kit-ui/**'
              - '.gitmodules'
            comfy-prompt:
              - 'app_web/comfy-prompt/**'
              - 'host/auth/**'
              - 'host/config/**'
              - 'host/db/**'
              - 'host/ui/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'packages/sa2kit/**'
              - 'packages/sa2kit-ui/**'
              - '.gitmodules'
            utilities:
              - 'app_web/utilities/**'
              - 'host/ui/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'packages/sa2kit/**'
              - 'packages/sa2kit-ui/**'
              - '.gitmodules'
            calendar-mobile:
              - 'app_mobile/calendar-mobile/**'
              - 'packages/sa2kit/**'
              - 'packages/sa2kit-ui/**'
              - '.gitmodules'
            teach-hub-mobile:
              - 'app_mobile/teach-hub-mobile/**'
              - 'packages/sa2kit/**'
              - 'packages/sa2kit-ui/**'
              - '.gitmodules'
            games:
              - 'app_games/**'
              - 'deploy/scripts/godot/export-godot-game.sh'
              - 'deploy/scripts/godot/export-all-godot-games.sh'
              - 'deploy/scripts/godot/compress-godot-www.sh'
              - 'deploy/scripts/godot/share-godot-engine-www.sh'
              - 'deploy/scripts/godot/sync-prebuilt-game-www.sh'
            wordpress:
              - 'app_wordpress/**'
              - '.gitmodules'
            deploy:
              - 'deploy/**'
              - 'app_wordpress/**'
              - '.github/workflows/docker-build-push.yml'
              - 'deploy/scripts/ci/send-ci-feishu-notify.mjs'

      - name: Build Docker matrix JSON
        id: matrix
        run: |
          set -euo pipefail
          satellites=()
          for app in calendar teach-hub showmasterpiece money-research node-notes idea-list filetransfer ticket-monitor fitness-plan comfy-prompt utilities; do
            case "$app" in
              calendar) changed="${{ steps.filter.outputs.calendar }}" ;;
              teach-hub) changed="${{ steps.filter.outputs.teach-hub }}" ;;
              showmasterpiece) changed="${{ steps.filter.outputs.showmasterpiece }}" ;;
              money-research) changed="${{ steps.filter.outputs.money-research }}" ;;
              node-notes) changed="${{ steps.filter.outputs.node-notes }}" ;;
              idea-list) changed="${{ steps.filter.outputs.idea-list }}" ;;
              filetransfer) changed="${{ steps.filter.outputs.filetransfer }}" ;;
              ticket-monitor) changed="${{ steps.filter.outputs.ticket-monitor }}" ;;
              fitness-plan) changed="${{ steps.filter.outputs.fitness-plan }}" ;;
              comfy-prompt) changed="${{ steps.filter.outputs.comfy-prompt }}" ;;
              utilities) changed="${{ steps.filter.outputs.utilities }}" ;;
            esac
            if [ "$changed" = "true" ]; then
              satellites+=("$app")
            fi
          done

          if [ ${#satellites[@]} -eq 0 ]; then
            echo 'satellites=[]' >> "$GITHUB_OUTPUT"
            echo 'any_satellites=false' >> "$GITHUB_OUTPUT"
            echo "No satellite Docker apps changed."
          else
            json="$(printf '%s\n' "${satellites[@]}" | jq -R . | jq -s -c .)"
            echo "satellites=${json}" >> "$GITHUB_OUTPUT"
            echo 'any_satellites=true' >> "$GITHUB_OUTPUT"
            echo "Satellite Docker apps to build: ${json}"
          fi

          echo "web changed: ${{ steps.filter.outputs.web }}"
          echo "calendar-mobile changed: ${{ steps.filter.outputs.calendar-mobile }}"
          echo "teach-hub-mobile changed: ${{ steps.filter.outputs.teach-hub-mobile }}"
          echo "games changed: ${{ steps.filter.outputs.games }}"
          echo "wordpress changed: ${{ steps.filter.outputs.wordpress }}"

  # 主站轨：失败阻断部署
  build-web:
    name: Build web (main)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Registry
        run: |
          echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login \
            -u "${{ secrets.ALIYUN_USERNAME }}" \
            --password-stdin ${{ env.REGISTRY }} || exit 1

      - name: Build Docker image (web)
        run: |
          docker buildx build --platform linux/amd64 \
            -f app_web/web/Dockerfile \
            -t qhr-profile-web:amd64 \
            --load .

      - name: Tag and push (web)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          NEW_TAG=${{ github.run_number }}
          IMAGE=${{ env.REGISTRY }}/qhr-profile-web:${NEW_TAG}
          docker tag qhr-profile-web:amd64 "$IMAGE"
          docker push "$IMAGE"
          LEGACY=${{ env.REGISTRY }}/qhr-profile:${NEW_TAG}
          docker tag qhr-profile-web:amd64 "$LEGACY"
          docker push "$LEGACY"

  # 卫星轨：失败报错但不阻断主站；失败时回退晋升旧镜像，避免 IMAGE_TAG 空洞
  build-satellites:
    name: Build satellites
    needs: changes
    if: needs.changes.outputs.any_satellites == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.docker_satellites) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Registry
        run: |
          echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login \
            -u "${{ secrets.ALIYUN_USERNAME }}" \
            --password-stdin ${{ env.REGISTRY }} || exit 1

      - name: Build Docker image (${{ matrix.app }})
        id: docker_build
        continue-on-error: true
        run: |
          docker buildx build --platform linux/amd64 \
            -f app_web/${{ matrix.app }}/Dockerfile \
            -t qhr-profile-${{ matrix.app }}:amd64 \
            --load .

      - name: Tag and push (${{ matrix.app }})
        if: >-
          steps.docker_build.outcome == 'success' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        run: |
          NEW_TAG=${{ github.run_number }}
          IMAGE=${{ env.REGISTRY }}/qhr-profile-${{ matrix.app }}:${NEW_TAG}
          docker tag qhr-profile-${{ matrix.app }}:amd64 "$IMAGE"
          docker push "$IMAGE"

      - name: Fallback promote previous image (${{ matrix.app }})
        if: >-
          steps.docker_build.outcome == 'failure' &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          echo "::warning::Satellite ${{ matrix.app }} build failed — promoting previous tag to ${{ github.run_number }}"
          bash deploy/scripts/ci/ci-promote-docker-image.sh "${{ matrix.app }}" "${{ github.run_number }}"

      - name: Upload soft-fail marker
        if: steps.docker_build.outcome == 'failure'
        run: echo "${{ matrix.app }}" > soft-fail.txt

      - name: Persist soft-fail marker
        if: steps.docker_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: soft-fail-satellite-${{ matrix.app }}
          path: soft-fail.txt
          retention-days: 2

      - name: Mark satellite build failed
        if: steps.docker_build.outcome == 'failure'
        run: |
          echo "Satellite ${{ matrix.app }} Docker build failed (fallback applied on main if possible)." >&2
          exit 1

  promote-images:
    name: Promote unchanged Docker images
    needs: changes
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (
        needs.changes.outputs.deploy == 'true' ||
        needs.changes.outputs.games == 'true' ||
        needs.changes.outputs.web == 'true' ||
        needs.changes.outputs.calendar == 'true' ||
        needs.changes.outputs.teach-hub == 'true' ||
        needs.changes.outputs.showmasterpiece == 'true' ||
        needs.changes.outputs.money-research == 'true' ||
        needs.changes.outputs.node-notes == 'true' ||
        needs.changes.outputs.idea-list == 'true' ||
        needs.changes.outputs.filetransfer == 'true' ||
        needs.changes.outputs.ticket-monitor == 'true' ||
        needs.changes.outputs.fitness-plan == 'true' ||
        needs.changes.outputs.comfy-prompt == 'true' ||
        needs.changes.outputs.utilities == 'true'
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, calendar, teach-hub, showmasterpiece, money-research, node-notes, idea-list, filetransfer, ticket-monitor, fitness-plan, comfy-prompt, utilities]
    steps:
      - name: Skip if app was rebuilt
        id: gate
        run: |
          case "${{ matrix.app }}" in
            web) changed="${{ needs.changes.outputs.web }}" ;;
            calendar) changed="${{ needs.changes.outputs.calendar }}" ;;
            teach-hub) changed="${{ needs.changes.outputs.teach-hub }}" ;;
            showmasterpiece) changed="${{ needs.changes.outputs.showmasterpiece }}" ;;
            money-research) changed="${{ needs.changes.outputs.money-research }}" ;;
            node-notes) changed="${{ needs.changes.outputs.node-notes }}" ;;
            idea-list) changed="${{ needs.changes.outputs.idea-list }}" ;;
            filetransfer) changed="${{ needs.changes.outputs.filetransfer }}" ;;
            ticket-monitor) changed="${{ needs.changes.outputs.ticket-monitor }}" ;;
            fitness-plan) changed="${{ needs.changes.outputs.fitness-plan }}" ;;
            comfy-prompt) changed="${{ needs.changes.outputs.comfy-prompt }}" ;;
            utilities) changed="${{ needs.changes.outputs.utilities }}" ;;
          esac
          if [ "$changed" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.app }} was rebuilt — skip promote"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "${{ matrix.app }} unchanged — promote previous image tag"
          fi

      - name: Checkout promote script
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Login to Aliyun Registry
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login \
            -u "${{ secrets.ALIYUN_USERNAME }}" \
            --password-stdin ${{ env.REGISTRY }} || exit 1

      - name: Promote previous tag to current run
        if: steps.gate.outputs.skip != 'true'
        env:
          REGISTRY: ${{ env.REGISTRY }}
        run: bash deploy/scripts/ci/ci-promote-docker-image.sh "${{ matrix.app }}" "${{ github.run_number }}"

  build-teach-hub-mobile:
    name: Build TeachHub Mobile APK
    needs: changes
    runs-on: ubuntu-latest
    continue-on-error: true
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.teach-hub-mobile == 'true'
    permissions:
      contents: write
    env:
      EXPO_ANDROID_VERSION_CODE: ${{ github.run_number }}
    outputs:
      apk_filename: ${{ steps.apk_meta.outputs.filename }}
      apk_download_url: ${{ steps.apk_meta.outputs.download_url }}
      release_url: ${{ steps.apk_meta.outputs.release_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Decrypt production config for API URLs
        id: cfg
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [ -z "$SOPS_AGE_KEY" ]; then
            echo "SOPS_AGE_KEY 未配置，无法解析生产 API 地址" >&2
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          DEPLOY_CFG_DIR=/tmp/profile-v1-mobile
          mkdir -p "$DEPLOY_CFG_DIR"
          printf '%s\n' "$SOPS_AGE_KEY" > "$DEPLOY_CFG_DIR/age-key.txt"
          chmod 600 "$DEPLOY_CFG_DIR/age-key.txt"
          SOPS_AGE_KEY_FILE="$DEPLOY_CFG_DIR/age-key.txt" \
            ./deploy/scripts/config/config-decrypt-production.sh "$DEPLOY_CFG_DIR/app.config.yaml"
          PUBLIC_URL="$(grep -E '^\s+publicUrl:' "$DEPLOY_CFG_DIR/app.config.yaml" | head -1 | sed -E 's/.*publicUrl:\s*"?([^"#]+)"?.*/\1/' | tr -d "'")"
          if [ -z "$PUBLIC_URL" ]; then
            echo "无法从 app.config 解析 auth.publicUrl" >&2
            exit 1
          fi
          echo "auth_base_url=${PUBLIC_URL}" >> "$GITHUB_OUTPUT"
          echo "api_base_url=${PUBLIC_URL}/teach-hub" >> "$GITHUB_OUTPUT"
          echo "public_url=${PUBLIC_URL}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate Android signing secrets
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: ${name}" >&2
              exit 1
            fi
          done
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build signed release APK
        run: bash app_mobile/teach-hub-mobile/scripts/android-release-build.sh
        env:
          SKIP_EXPO_PREBUILD: '1'
          APP_VERSION: '0.1.0'
          EXPO_PUBLIC_AUTH_BASE_URL: ${{ steps.cfg.outputs.auth_base_url }}
          EXPO_PUBLIC_TEACH_HUB_API_BASE_URL: ${{ steps.cfg.outputs.api_base_url }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Resolve APK metadata
        id: apk_meta
        run: |
          APK_PATH="$(ls -t app_mobile/teach-hub-mobile/dist/*.apk | head -1)"
          APK_NAME="$(basename "$APK_PATH")"
          TAG_NAME="teach-hub-mobile-ci-${GITHUB_RUN_NUMBER}"
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"
          DOWNLOAD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${APK_NAME}"
          echo "filename=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_url=${RELEASE_URL}" >> "$GITHUB_OUTPUT"
          echo "download_url=${DOWNLOAD_URL}" >> "$GITHUB_OUTPUT"
          echo "Built APK: ${APK_PATH}"
          echo "Release: ${RELEASE_URL}"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk_meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: TeachHub Mobile CI #${{ github.run_number }}
          body: |
            Android release APK from main CI build.

            - Run: #${{ github.run_number }}
            - versionCode: `${{ github.run_number }}`
            - Auth: `${{ steps.cfg.outputs.auth_base_url }}`
            - API: `${{ steps.cfg.outputs.api_base_url }}`
          files: app_mobile/teach-hub-mobile/dist/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Soft-fail marker
        if: failure()
        run: echo teach-hub-mobile > soft-fail.txt

      - name: Persist soft-fail marker
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soft-fail-teach-hub-mobile
          path: soft-fail.txt
          retention-days: 2

  build-calendar-mobile:
    name: Build Calendar Mobile APK
    needs: changes
    runs-on: ubuntu-latest
    continue-on-error: true
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.calendar-mobile == 'true'
    permissions:
      contents: write
    env:
      EXPO_ANDROID_VERSION_CODE: ${{ github.run_number }}
    outputs:
      apk_filename: ${{ steps.apk_meta.outputs.filename }}
      apk_download_url: ${{ steps.apk_meta.outputs.download_url }}
      release_url: ${{ steps.apk_meta.outputs.release_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Decrypt production config for API URLs
        id: cfg
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [ -z "$SOPS_AGE_KEY" ]; then
            echo "SOPS_AGE_KEY 未配置，无法解析生产 API 地址" >&2
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          DEPLOY_CFG_DIR=/tmp/profile-v1-calendar-mobile
          mkdir -p "$DEPLOY_CFG_DIR"
          printf '%s\n' "$SOPS_AGE_KEY" > "$DEPLOY_CFG_DIR/age-key.txt"
          chmod 600 "$DEPLOY_CFG_DIR/age-key.txt"
          SOPS_AGE_KEY_FILE="$DEPLOY_CFG_DIR/age-key.txt" \
            ./deploy/scripts/config/config-decrypt-production.sh "$DEPLOY_CFG_DIR/app.config.yaml"
          PUBLIC_URL="$(grep -E '^\s+publicUrl:' "$DEPLOY_CFG_DIR/app.config.yaml" | head -1 | sed -E 's/.*publicUrl:\s*"?([^"#]+)"?.*/\1/' | tr -d "'")"
          if [ -z "$PUBLIC_URL" ]; then
            echo "无法从 app.config 解析 auth.publicUrl" >&2
            exit 1
          fi
          echo "auth_base_url=${PUBLIC_URL}" >> "$GITHUB_OUTPUT"
          echo "api_base_url=${PUBLIC_URL}/calendar" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate Android signing secrets
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: ${name}" >&2
              exit 1
            fi
          done
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build signed release APK
        run: bash app_mobile/calendar-mobile/scripts/android-release-build.sh
        env:
          SKIP_EXPO_PREBUILD: '1'
          APP_VERSION: '0.1.0'
          EXPO_PUBLIC_AUTH_BASE_URL: ${{ steps.cfg.outputs.auth_base_url }}
          EXPO_PUBLIC_CALENDAR_API_BASE_URL: ${{ steps.cfg.outputs.api_base_url }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Resolve APK metadata
        id: apk_meta
        run: |
          APK_PATH="$(ls -t app_mobile/calendar-mobile/dist/*.apk | head -1)"
          APK_NAME="$(basename "$APK_PATH")"
          TAG_NAME="calendar-mobile-ci-${GITHUB_RUN_NUMBER}"
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"
          DOWNLOAD_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${APK_NAME}"
          echo "filename=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_url=${RELEASE_URL}" >> "$GITHUB_OUTPUT"
          echo "download_url=${DOWNLOAD_URL}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk_meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Calendar Mobile CI #${{ github.run_number }}
          body: |
            Android release APK from main CI build.

            - Run: #${{ github.run_number }}
            - versionCode: `${{ github.run_number }}`
            - Auth: `${{ steps.cfg.outputs.auth_base_url }}`
            - API: `${{ steps.cfg.outputs.api_base_url }}`
          files: app_mobile/calendar-mobile/dist/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Soft-fail marker
        if: failure()
        run: echo calendar-mobile > soft-fail.txt

      - name: Persist soft-fail marker
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soft-fail-calendar-mobile
          path: soft-fail.txt
          retention-days: 2

  export-godot-games:
    name: Export Godot Games (Web)
    needs: changes
    if: needs.changes.outputs.games == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Godot editor and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot-ci
            ~/.local/share/godot/export_templates
          key: godot-4.7.1-stable-${{ runner.os }}-v1

      - name: Export all Godot games (Web, single-thread)
        run: bash deploy/scripts/godot/export-all-godot-games.sh

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: godot-games-www
          path: deploy/games/*/www
          if-no-files-found: error
          retention-days: 7

      - name: Soft-fail marker
        if: failure()
        run: echo godot-games > soft-fail.txt

      - name: Persist soft-fail marker
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soft-fail-godot-games
          path: soft-fail.txt
          retention-days: 2

  deploy-web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [changes, build-web, build-satellites, promote-images, export-godot-games]
    # 主站轨硬依赖；卫星/游戏失败不阻断（continue-on-error + 允许 failure）
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !cancelled() &&
      needs.changes.result == 'success' &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      (needs.promote-images.result == 'success' || needs.promote-images.result == 'skipped') &&
      (needs.build-satellites.result == 'success' || needs.build-satellites.result == 'failure' || needs.build-satellites.result == 'skipped') &&
      (needs.export-godot-games.result == 'success' || needs.export-godot-games.result == 'failure' || needs.export-godot-games.result == 'skipped') &&
      (
        needs.changes.outputs.deploy == 'true' ||
        needs.changes.outputs.games == 'true' ||
        needs.changes.outputs.wordpress == 'true' ||
        needs.changes.outputs.web == 'true' ||
        needs.changes.outputs.calendar == 'true' ||
        needs.changes.outputs.teach-hub == 'true' ||
        needs.changes.outputs.showmasterpiece == 'true' ||
        needs.changes.outputs.money-research == 'true' ||
        needs.changes.outputs.node-notes == 'true' ||
        needs.changes.outputs.idea-list == 'true' ||
        needs.changes.outputs.filetransfer == 'true' ||
        needs.changes.outputs.ticket-monitor == 'true' ||
        needs.changes.outputs.fitness-plan == 'true' ||
        needs.changes.outputs.comfy-prompt == 'true' ||
        needs.changes.outputs.utilities == 'true'
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Godot games web artifacts
        if: needs.changes.outputs.games == 'true' && needs.export-godot-games.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: godot-games-www
          path: /tmp/godot-games-www

      - name: Place www artifacts into deploy/games
        if: needs.changes.outputs.games == 'true' && needs.export-godot-games.result == 'success'
        run: |
          set -euo pipefail
          # Artifact may nest as <slug>/www or deploy/games/<slug>/www
          mapfile -t slugs < <(for p in app_games/*/project.godot; do [ -f "$p" ] && basename "$(dirname "$p")"; done | sort -u)
          if [ "${#slugs[@]}" -eq 0 ]; then
            echo "ERROR: no app_games/*/project.godot" >&2
            exit 1
          fi
          for slug in "${slugs[@]}"; do
            mkdir -p "deploy/games/${slug}/www"
            src=""
            if [ -f "/tmp/godot-games-www/${slug}/www/index.html" ]; then
              src="/tmp/godot-games-www/${slug}/www"
            elif [ -f "/tmp/godot-games-www/deploy/games/${slug}/www/index.html" ]; then
              src="/tmp/godot-games-www/deploy/games/${slug}/www"
            elif [ -f "/tmp/godot-games-www/${slug}/index.html" ]; then
              src="/tmp/godot-games-www/${slug}"
            fi
            if [ -n "$src" ]; then
              rsync -a --delete --exclude '.gitkeep' "${src}/" "deploy/games/${slug}/www/"
              echo "placed ${slug} from ${src}"
            else
              echo "WARN: no www for ${slug} in artifact" >&2
              find /tmp/godot-games-www -maxdepth 4 -type f | head -40
              exit 1
            fi
          done
          # 共享引擎（export-all 末尾 share-godot-engine-www.sh 产出）
          eng_src=""
          if [ -f /tmp/godot-games-www/godot-engine/www/index.wasm ]; then
            eng_src=/tmp/godot-games-www/godot-engine/www
          elif [ -f /tmp/godot-games-www/deploy/games/godot-engine/www/index.wasm ]; then
            eng_src=/tmp/godot-games-www/deploy/games/godot-engine/www
          fi
          if [ -n "$eng_src" ]; then
            mkdir -p deploy/games/godot-engine/www
            rsync -a --delete --exclude '.gitkeep' "${eng_src}/" deploy/games/godot-engine/www/
            echo "placed godot-engine from ${eng_src}"
          else
            echo "ERROR: shared godot-engine www missing from artifact" >&2
            find /tmp/godot-games-www -maxdepth 4 -type f | head -40
            exit 1
          fi

      - name: Decrypt production config
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [ -z "$SOPS_AGE_KEY" ]; then
            echo "ERROR: GitHub Secret SOPS_AGE_KEY 未配置" >&2
            echo "请将 config/keys/age-key.txt 全文添加到仓库 Secrets → SOPS_AGE_KEY" >&2
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          DEPLOY_CFG_DIR=/tmp/profile-v1-deploy
          mkdir -p "$DEPLOY_CFG_DIR"
          printf '%s\n' "$SOPS_AGE_KEY" > "$DEPLOY_CFG_DIR/age-key.txt"
          chmod 600 "$DEPLOY_CFG_DIR/age-key.txt"
          SOPS_AGE_KEY_FILE="$DEPLOY_CFG_DIR/age-key.txt" \
            ./deploy/scripts/config/config-decrypt-production.sh "$DEPLOY_CFG_DIR/app.config.yaml"

      - name: Mirror nginx to Aliyun registry
        run: |
          set -euo pipefail
          echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login \
            -u "${{ secrets.ALIYUN_USERNAME }}" \
            --password-stdin "${{ env.REGISTRY }}"
          REGISTRY="${{ env.REGISTRY }}" bash deploy/scripts/ci/ci-mirror-base-images.sh

      - name: Deploy gateway stack to remote server
        timeout-minutes: 40
        env:
          REGISTRY: crpi-pnnot5dqi45utyya.cn-beijing.personal.cr.aliyuncs.com/qhrqht
          ALIYUN_USERNAME: ${{ secrets.ALIYUN_USERNAME }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
          WP_MARIADB_ROOT_PASSWORD: ${{ secrets.WP_MARIADB_ROOT_PASSWORD }}
          WP_DB_USER: ${{ secrets.WP_DB_USER }}
          WP_DB_PASSWORD: ${{ secrets.WP_DB_PASSWORD }}
          WP_HOLT_PUBLIC_URL: ${{ secrets.WP_HOLT_PUBLIC_URL }}
          GAMES_CHANGED: ${{ needs.changes.outputs.games == 'true' && needs.export-godot-games.result == 'success' && 'true' || 'false' }}
          WORDPRESS_CHANGED: ${{ needs.changes.outputs.wordpress }}
        run: |
          NEW_TAG=${{ github.run_number }}
          DEPLOY_CFG_DIR=/tmp/profile-v1-deploy
          DEPLOY_USER="${{ secrets.DEPLOY_SERVER_USERNAME }}"
          DEPLOY_HOST="${{ secrets.DEPLOY_SERVER_HOST }}"
          CTRL_DIR=$(mktemp -d)
          CTRL_PATH="$CTRL_DIR/ssh_mux"
          # 单条 ControlMaster 复用，避免多次握手打爆 MaxStartups
          SSH_OPTS="-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o ConnectTimeout=45 -o ControlMaster=auto -o ControlPath=$CTRL_PATH -o ControlPersist=10m -i /tmp/ssh_key"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"

          echo "${{ secrets.DEPLOY_SERVER_SSH_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

          cleanup_ssh() {
            ssh -O exit $SSH_OPTS "$REMOTE" 2>/dev/null || true
            rm -rf "$CTRL_DIR" /tmp/ssh_key
          }
          trap cleanup_ssh EXIT

          ssh_retry() {
            local attempt=1
            local max=8
            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max" ]; then
                echo "ERROR: ssh/scp 重试 ${max} 次仍失败: $*" >&2
                return 1
              fi
              echo "WARN: 连接失败，${attempt}/${max}，sleep $((attempt * 15))s 后重试…"
              sleep $((attempt * 15))
              attempt=$((attempt + 1))
            done
          }

          echo "=== 等待远端 SSH 可用（banner）==="
          ssh_retry ssh $SSH_OPTS -o BatchMode=yes "$REMOTE" 'echo SSH_READY'

          echo "=== 打包并同步 deploy 文件（复用同一 SSH）==="
          ssh_retry ssh $SSH_OPTS "$REMOTE" \
            "mkdir -p /root/profile-v1/nginx /root/profile-v1/gateway /root/profile-v1/wordpress/holt /root/profile-v1/deploy/wordpress /root/profile-v1/games"

          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/nginx" "$STAGE/gateway" "$STAGE/deploy/wordpress" "$STAGE/games"
          cp "$DEPLOY_CFG_DIR/app.config.yaml" "$STAGE/app.config.yaml"
          cp deploy/docker-compose.gateway.yml "$STAGE/"
          cp deploy/nginx/profile-platform.conf deploy/nginx/proxy-params.conf \
            deploy/nginx/outer-ubuntu-qhr062.conf deploy/nginx/proxy-params-outer.conf \
            "$STAGE/nginx/"
          cp deploy/gateway/*.sh "$STAGE/gateway/"
          cp deploy/scripts/godot/compress-godot-www.sh "$STAGE/"
          cp deploy/wordpress/README.md deploy/wordpress/ADD-SITE.md deploy/wordpress/.env.example \
            "$STAGE/deploy/wordpress/"
          cp deploy/games/README.md deploy/games/ADD-GAME.md "$STAGE/games/"

          {
            echo "REGISTRY=${REGISTRY}"
            echo "IMAGE_TAG=${NEW_TAG}"
            echo "GATEWAY_PORT=3000"
            [ -n "${WP_MARIADB_ROOT_PASSWORD:-}" ] && printf 'MARIADB_ROOT_PASSWORD=%s\n' "$WP_MARIADB_ROOT_PASSWORD"
            [ -n "${WP_DB_USER:-}" ] && printf 'WORDPRESS_DB_USER=%s\n' "$WP_DB_USER"
            [ -n "${WP_DB_PASSWORD:-}" ] && printf 'WORDPRESS_DB_PASSWORD=%s\n' "$WP_DB_PASSWORD"
            [ -n "${WP_HOLT_PUBLIC_URL:-}" ] && printf 'WP_HOLT_PUBLIC_URL=%s\n' "$WP_HOLT_PUBLIC_URL"
            [ -n "${WP_HOLT_PUBLIC_URL:-}" ] && printf 'WORDPRESS_DB_NAME=wp_holt\n'
          } > "$STAGE/wp-deploy.env"

          tar -C "$STAGE" -czf /tmp/profile-v1-deploy-bundle.tgz .
          ssh_retry scp $SSH_OPTS /tmp/profile-v1-deploy-bundle.tgz "$REMOTE:/tmp/profile-v1-deploy-bundle.tgz"
          ssh_retry ssh $SSH_OPTS "$REMOTE" \
            'tar -C /root/profile-v1 -xzf /tmp/profile-v1-deploy-bundle.tgz && rm -f /tmp/profile-v1-deploy-bundle.tgz && chmod 644 /root/profile-v1/app.config.yaml && chmod 755 /root/profile-v1/gateway/*.sh /root/profile-v1/compress-godot-www.sh && mv -f /root/profile-v1/wp-deploy.env /tmp/profile-wp-deploy.env'
          rm -rf "$STAGE" /tmp/profile-v1-deploy-bundle.tgz

          if [ "${WORDPRESS_CHANGED}" = "true" ]; then
            echo "=== 同步 WordPress 子站 submodule: holt ==="
            ssh_retry scp -r $SSH_OPTS app_wordpress/holt/* "$REMOTE:/root/profile-v1/wordpress/holt/"
          fi

          bash deploy/scripts/godot/sync-prebuilt-game-www.sh
          for game_dir in deploy/games/*/; do
            [ -d "$game_dir" ] || continue
            slug="$(basename "$game_dir")"
            [ -d "${game_dir}www" ] || continue
            should_sync=0
            if [ "$slug" = "godot-engine" ] && [ -f "${game_dir}www/index.wasm" ]; then
              # 共享引擎只有 wasm/js，无 index.html
              if [ "${GAMES_CHANGED}" = "true" ]; then
                should_sync=1
              fi
            elif [ -f "${game_dir}www/index.html" ]; then
              if [ "${GAMES_CHANGED}" = "true" ] || [ -f "app_games/${slug}/.use-prebuilt-web" ]; then
                should_sync=1
              fi
            fi
            if [ "$should_sync" = "1" ]; then
              echo "=== 同步游戏 Web 产物: ${slug} ==="
              ssh_retry ssh $SSH_OPTS "$REMOTE" "mkdir -p /root/profile-v1/games/${slug}/www"
              ssh_retry scp -r $SSH_OPTS "${game_dir}www/"* "$REMOTE:/root/profile-v1/games/${slug}/www/"
            fi
          done
          if [ "${GAMES_CHANGED}" != "true" ]; then
            echo "=== 未改 Godot 源码：保留服务器已有导出包；仍同步 .use-prebuilt-web ==="
          fi

          echo "=== 服务器登录阿里云镜像仓 + 部署 + 冒烟（同一 SSH）==="
          REGISTRY_HOST="${REGISTRY%%/*}"
          remote_docker_login() {
            printf '%s\n' "${ALIYUN_PASSWORD}" | ssh $SSH_OPTS "$REMOTE" \
              "docker login -u '${ALIYUN_USERNAME}' --password-stdin '${REGISTRY_HOST}'"
          }
          ssh_retry remote_docker_login

          ssh_retry ssh $SSH_OPTS "$REMOTE" \
            'set -a; . /tmp/profile-wp-deploy.env; set +a; rm -f /tmp/profile-wp-deploy.env; /root/profile-v1/gateway/deploy-profile-v1.sh && POST_DEPLOY=1 /root/profile-v1/gateway/fix-gateway-remote.sh'

          rm -f "$DEPLOY_CFG_DIR/age-key.txt" "$DEPLOY_CFG_DIR/app.config.yaml"

  ci-status:
    name: Resolve notify status
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        build-web,
        build-satellites,
        promote-images,
        deploy-web,
        export-godot-games,
        build-teach-hub-mobile,
        build-calendar-mobile,
      ]
    if: always() && !cancelled()
    outputs:
      notify_status: ${{ steps.calc.outputs.status }}
      soft_fail_summary: ${{ steps.calc.outputs.soft_summary }}
    steps:
      - name: Download soft-fail markers
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: soft-fail-*
          merge-multiple: true
          path: soft-fails

      - name: Calculate status
        id: calc
        env:
          WEB: ${{ needs.build-web.result }}
          SAT: ${{ needs.build-satellites.result }}
          PROMOTE: ${{ needs.promote-images.result }}
          DEPLOY: ${{ needs.deploy-web.result }}
          GAMES: ${{ needs.export-godot-games.result }}
          TH: ${{ needs.build-teach-hub-mobile.result }}
          CAL: ${{ needs.build-calendar-mobile.result }}
        run: |
          set -euo pipefail
          primary_fail=0
          for r in "$WEB" "$PROMOTE" "$DEPLOY"; do
            case "$r" in
              failure|cancelled) primary_fail=1 ;;
            esac
          done

          soft_summary=""
          if [ -d soft-fails ]; then
            soft_summary="$(
              find soft-fails -type f -print 2>/dev/null \
                | while IFS= read -r f; do cat "$f"; done \
                | sort -u \
                | paste -sd, - \
                || true
            )"
          fi
          soft_fail=0
          if [ -n "$soft_summary" ]; then
            soft_fail=1
          fi
          for r in "$SAT" "$GAMES" "$TH" "$CAL"; do
            case "$r" in
              failure) soft_fail=1 ;;
            esac
          done

          if [ "$primary_fail" = 1 ]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
          elif [ "$soft_fail" = 1 ]; then
            echo "status=partial" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "soft_summary<<EOF"
            echo "${soft_summary}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "notify status computed: primary_fail=${primary_fail} soft_fail=${soft_fail} soft_summary=${soft_summary}"

  notify:
    name: Notify Feishu
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        build-web,
        build-satellites,
        deploy-web,
        promote-images,
        export-godot-games,
        build-teach-hub-mobile,
        build-calendar-mobile,
        ci-status,
      ]
    if: always() && !cancelled()
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Decrypt production config for Feishu webhook
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [ -z "$SOPS_AGE_KEY" ]; then
            echo "SOPS_AGE_KEY 未配置，跳过解密（将使用 FEISHU_WEBHOOK_URL Secret）"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          DEPLOY_CFG_DIR=/tmp/profile-v1-notify
          mkdir -p "$DEPLOY_CFG_DIR"
          printf '%s\n' "$SOPS_AGE_KEY" > "$DEPLOY_CFG_DIR/age-key.txt"
          chmod 600 "$DEPLOY_CFG_DIR/age-key.txt"
          SOPS_AGE_KEY_FILE="$DEPLOY_CFG_DIR/age-key.txt" \
            ./deploy/scripts/config/config-decrypt-production.sh "$DEPLOY_CFG_DIR/app.config.yaml"
          echo "APP_CONFIG_PATH=$DEPLOY_CFG_DIR/app.config.yaml" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Send Feishu notification
        continue-on-error: true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_SIGN_SECRET }}
          CI_NOTIFY_STATUS: ${{ needs.ci-status.outputs.notify_status }}
          CI_SOFT_FAIL_SUMMARY: ${{ needs.ci-status.outputs.soft_fail_summary }}
          CI_WEB_BUILD_RESULT: ${{ needs.build-web.result }}
          CI_SATELLITES_BUILD_RESULT: ${{ needs.build-satellites.result }}
          CI_PROMOTE_RESULT: ${{ needs.promote-images.result }}
          CI_DEPLOY_RESULT: ${{ needs.deploy-web.result }}
          CI_GAMES_BUILD_RESULT: ${{ needs.export-godot-games.result }}
          CI_IMAGE_TAG: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.build-web.result == 'success' || needs.promote-images.result == 'success' || needs.build-satellites.result == 'success' || needs.build-satellites.result == 'failure') && format('web:{0} calendar:{0} teach-hub:{0} showmasterpiece:{0} money-research:{0} node-notes:{0} idea-list:{0} filetransfer:{0} ticket-monitor:{0} fitness-plan:{0} comfy-prompt:{0} utilities:{0}', github.run_number) || '' }}
          CI_TEACH_HUB_APK_BUILD_RESULT: ${{ needs.build-teach-hub-mobile.result }}
          CI_TEACH_HUB_APK_RELEASE_URL: ${{ needs.build-teach-hub-mobile.result == 'success' && needs.build-teach-hub-mobile.outputs.release_url || '' }}
          CI_TEACH_HUB_APK_DOWNLOAD_URL: ${{ needs.build-teach-hub-mobile.result == 'success' && needs.build-teach-hub-mobile.outputs.apk_download_url || '' }}
          CI_CALENDAR_APK_BUILD_RESULT: ${{ needs.build-calendar-mobile.result }}
          CI_CALENDAR_APK_RELEASE_URL: ${{ needs.build-calendar-mobile.result == 'success' && needs.build-calendar-mobile.outputs.release_url || '' }}
          CI_CALENDAR_APK_DOWNLOAD_URL: ${{ needs.build-calendar-mobile.result == 'success' && needs.build-calendar-mobile.outputs.apk_download_url || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: node deploy/scripts/ci/send-ci-feishu-notify.mjs
