name: Reset Holt WordPress Admin Password

on:
  workflow_dispatch:
    inputs:
      new_password:
        description: New administrator password
        required: true
        type: string

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reset password on deploy host
        env:
          NEW_PASSWORD: ${{ inputs.new_password }}
        run: |
          set -euo pipefail
          DEPLOY_USER="${{ secrets.DEPLOY_SERVER_USERNAME }}"
          DEPLOY_HOST="${{ secrets.DEPLOY_SERVER_HOST }}"
          SSH_OPTS="-o StrictHostKeyChecking=no -i /tmp/ssh_key"
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"

          printf '%s\n' "${{ secrets.DEPLOY_SERVER_SSH_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

          scp $SSH_OPTS deploy/reset-wordpress-holt-password.sh \
            "$REMOTE:/root/profile-v1/reset-wordpress-holt-password.sh"
          ssh $SSH_OPTS "$REMOTE" "chmod 700 /root/profile-v1/reset-wordpress-holt-password.sh"

          # 通过临时 env 文件注入，避免密码出现在进程列表/命令行审计中
          umask 077
          printf 'NEW_PASSWORD=%s\n' "$NEW_PASSWORD" > /tmp/wp-reset.env
          scp $SSH_OPTS /tmp/wp-reset.env "$REMOTE:/tmp/wp-holt-reset.env"
          rm -f /tmp/wp-reset.env

          ssh $SSH_OPTS "$REMOTE" \
            'set -a; . /tmp/wp-holt-reset.env; set +a; rm -f /tmp/wp-holt-reset.env; cd /root/profile-v1 && ./reset-wordpress-holt-password.sh'

          rm -f /tmp/ssh_key
          echo "Password reset completed."
